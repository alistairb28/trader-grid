<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader Grid Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --surface: #17171a;
    --surface2: #1f1f24;
    --surface3: #28282f;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0f0f0;
    --text2: #9090a0;
    --text3: #55555f;
    --JR: #4a8ff5;
    --JLB: #2ec090;
    --SM: #e8608a;
    --beginner: #e05555;
    --intermediate: #e8872a;
    --advanced: #d4a017;
    --expert: #3aaa5c;
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; min-height: 100vh; }

  /* Layout */
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .main { padding: 28px 28px; overflow-x: hidden; }

  /* Sidebar */
  .logo { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: 0.05em; padding: 0 4px; }
  .logo span { color: var(--text3); }
  .section-title { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); padding: 0 4px; margin-bottom: 6px; }
  .trader-list { display: flex; flex-direction: column; gap: 4px; }
  .trader-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; transition: all 0.15s; }
  .trader-item:hover { background: var(--surface2); }
  .trader-item.active { background: var(--surface2); border-color: var(--border2); }
  .trader-item.dim { opacity: 0.35; }
  .t-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .t-name { font-weight: 500; font-size: 13px; }
  .t-score { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2); }
  .mode-list { display: flex; flex-direction: column; gap: 3px; }
  .mode-item { padding: 7px 10px; border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 8px; transition: all 0.15s; }
  .mode-item:hover { background: var(--surface2); color: var(--text); }
  .mode-item.active { background: var(--surface2); color: var(--text); font-weight: 500; }
  .mode-icon { font-size: 15px; }
  .band-legend { display: flex; flex-direction: column; gap: 5px; }
  .band-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text2); padding: 0 4px; }
  .band-bar { width: 24px; height: 3px; border-radius: 2px; }
  .band-range { font-family: 'DM Mono', monospace; font-size: 10px; margin-left: auto; color: var(--text3); }

  /* Header */
  .page-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; }
  .page-title { font-size: 20px; font-weight: 600; }
  .page-sub { font-size: 13px; color: var(--text2); }

  /* Summary bar */
  .summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
  .s-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
  .s-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .s-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; color: #fff; }
  .s-trader-name { font-weight: 600; font-size: 14px; }
  .s-total { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text2); }
  .s-progress-row { display: flex; gap: 3px; }
  .s-seg { height: 4px; flex: 1; border-radius: 2px; background: var(--surface3); overflow: hidden; }
  .s-seg-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .s-domains { margin-top: 10px; display: flex; flex-direction: column; gap: 3px; }
  .s-domain-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .s-domain-name { color: var(--text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-cur { font-family: 'DM Mono', monospace; font-size: 11px; }
  .s-goal-arrow { font-size: 10px; color: var(--text3); }
  .s-goal-val { font-family: 'DM Mono', monospace; font-size: 11px; }

  /* Grid */
  .grid-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .grid-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  .col-domain { width: 155px; min-width: 155px; }
  thead tr:first-child th { padding: 10px 6px 4px; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; }
  thead tr:first-child th.col-domain { text-align: left; padding-left: 16px; color: var(--text3); }
  thead tr:last-child th { padding: 4px 4px 10px; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); text-align: center; border-bottom: 1px solid var(--border); }
  thead tr:last-child th.col-domain { text-align: left; padding-left: 16px; }
  .band-divider-left { border-left: 1px solid var(--border); }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  td.domain-cell { padding: 10px 16px; font-size: 12px; font-weight: 500; color: var(--text2); line-height: 1.3; }
  td.level-cell { text-align: center; padding: 6px 3px; cursor: default; position: relative; }
  td.level-cell.clickable { cursor: pointer; }
  td.level-cell.clickable:hover { background: rgba(255,255,255,0.04); }
  .cell-inner { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 2px; border-radius: 5px; }
  .pips { display: flex; gap: 2px; justify-content: center; }
  .pip { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--surface3); background: transparent; transition: all 0.15s; }
  .pip-filled { border-color: transparent; }
  .pip-goal { border-style: dashed; background: transparent; }

  /* Edit highlight */
  .edit-bar { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 8px 16px; font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 8px; }
  .edit-bar-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--expert); }

  /* Toast */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface3); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 16px; font-size: 13px; color: var(--text); opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* Context menu */
  .ctx-menu { position: fixed; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 6px; min-width: 160px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .ctx-title { font-size: 10px; color: var(--text3); padding: 4px 8px 6px; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .ctx-item { padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 8px; }
  .ctx-item:hover { background: var(--surface3); color: var(--text); }
  .ctx-item .ctx-dot { width: 8px; height: 8px; border-radius: 50%; }
  .ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }
  .ctx-level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 4px 4px 2px; }
  .ctx-level-btn { padding: 5px; text-align: center; border-radius: 4px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text2); background: var(--surface3); transition: all 0.1s; }
  .ctx-level-btn:hover { color: var(--text); }
  .ctx-level-btn.cur { color: #fff; }
  .ctx-level-btn.goal-set { outline: 1.5px dashed; outline-offset: -1.5px; }

  /* Notes modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; display: flex; align-items: center; justify-content: center; }
  .modal { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 20px; width: 420px; max-width: 90vw; box-shadow: 0 16px 48px rgba(0,0,0,0.5); }
  .modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .modal-title { font-size: 14px; font-weight: 600; flex: 1; }
  .modal-close { cursor: pointer; color: var(--text3); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
  .modal-close:hover { background: var(--surface3); color: var(--text); }
  .modal-meta { font-size: 11px; color: var(--text3); margin-bottom: 12px; }
  .modal textarea { width: 100%; background: var(--surface3); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 10px 12px; resize: vertical; min-height: 100px; outline: none; line-height: 1.6; }
  .modal textarea:focus { border-color: rgba(255,255,255,0.25); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .btn { padding: 7px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border2); background: var(--surface3); color: var(--text2); transition: all 0.15s; }
  .btn:hover { background: var(--surface); color: var(--text); }
  .btn-primary { background: var(--surface3); border-color: var(--border2); color: var(--text); }
  .btn-primary:hover { border-color: rgba(255,255,255,0.3); }
  .note-indicator { width: 5px; height: 5px; border-radius: 50%; background: #d4a017; display: inline-block; margin-left: 2px; vertical-align: middle; }
  .s-note { font-size: 10px; color: var(--text3); font-style: italic; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: relative; height: auto; flex-direction: row; flex-wrap: wrap; padding: 14px; }
    .main { padding: 16px; }
    .summary-bar { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">THE GRID <span>tracker</span></div>

    <div>
      <div class="section-title">Traders</div>
      <div class="trader-list" id="trader-list"></div>
    </div>

    <div>
      <div class="section-title">Mode</div>
      <div class="mode-list">
        <div class="mode-item active" data-mode="view" id="mode-view"><span class="mode-icon">👁</span> View</div>
        <div class="mode-item" data-mode="edit" id="mode-edit"><span class="mode-icon">✏️</span> Edit levels</div>
        <div class="mode-item" data-mode="goal" id="mode-goal"><span class="mode-icon">🎯</span> Set goals</div>
      </div>
    </div>

    <div>
      <div class="section-title">Bands</div>
      <div class="band-legend">
        <div class="band-item"><div class="band-bar" style="background:var(--beginner)"></div>Beginner<span class="band-range">1–2</span></div>
        <div class="band-item"><div class="band-bar" style="background:var(--intermediate)"></div>Intermediate<span class="band-range">3–4</span></div>
        <div class="band-item"><div class="band-bar" style="background:var(--advanced)"></div>Advanced<span class="band-range">5–6</span></div>
        <div class="band-item"><div class="band-bar" style="background:var(--expert)"></div>Expert<span class="band-range">7–8</span></div>
      </div>
    </div>

    <div style="margin-top:auto;">
      <div class="section-title">Export</div>
      <div class="mode-item" id="btn-export" style="cursor:pointer"><span class="mode-icon">💾</span> Save JSON</div>
      <div class="mode-item" id="btn-import" style="cursor:pointer"><span class="mode-icon">📂</span> Load JSON</div>
      <input type="file" id="file-input" accept=".json" style="display:none">
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <div class="page-title">The Grid</div>
      <div class="page-sub">Trader progression tracker</div>
    </div>

    <div class="summary-bar" id="summary-bar"></div>

    <div class="grid-container">
      <div id="edit-bar" style="display:none" class="edit-bar">
        <div class="edit-bar-dot"></div>
        <span id="edit-bar-text"></span>
      </div>
      <div class="grid-scroll">
        <table id="main-table"></table>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="ctx-overlay" style="position:fixed;inset:0;z-index:199;display:none;" onclick="closeCtx()"></div>
<div class="ctx-menu" id="ctx-menu" style="display:none"></div>
<div class="modal-bg" id="notes-modal" style="display:none" onclick="handleModalBgClick(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-close" onclick="closeNotesModal()">✕</div>
    </div>
    <div class="modal-meta" id="modal-meta"></div>
    <textarea id="modal-textarea" placeholder="Add notes about this goal — focus areas, timelines, context..."></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeNotesModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNote()">Save note</button>
    </div>
  </div>
</div>

<script>
const DOMAINS = [
  'Cricket Knowledge',
  'Cricket Understanding',
  'Pricing – Model biases',
  'Pricing – Factors not in model',
  'Execution – Confidence',
  'Execution – Efficiency',
  'Non-Trading Work',
  'Comms & Professionalism'
];

const TRADERS = ['JR','JLB','SM'];
const COLORS = { JR: '#4a8ff5', JLB: '#2ec090', SM: '#e8608a' };

function bandColor(v) {
  if (v <= 2) return '#e05555';
  if (v <= 4) return '#e8872a';
  if (v <= 6) return '#d4a017';
  return '#3aaa5c';
}
function bandName(v) {
  if (v <= 2) return 'Beginner';
  if (v <= 4) return 'Intermediate';
  if (v <= 6) return 'Advanced';
  return 'Expert';
}

let state = {
  current: {
    JR:  [4,5,2,3,2,2,4,3],
    JLB: [4,3,3,3,4,3,4,5],
    SM:  [7,6,2,3,2,2,1,2]
  },
  goals: {
    JR:  [null,null,null,null,null,null,null,null],
    JLB: [null,null,null,null,null,null,null,null],
    SM:  [null,null,null,null,null,null,null,null]
  },
  notes: {
    JR:  ['','','','','','','',''],
    JLB: ['','','','','','','',''],
    SM:  ['','','','','','','','']
  }
};

let activeTraders = new Set(['JR','JLB','SM']);
let mode = 'view';

// --- Render sidebar traders ---
function renderSidebar() {
  const list = document.getElementById('trader-list');
  list.innerHTML = '';
  TRADERS.forEach(t => {
    const total = state.current[t].reduce((a,b)=>a+b,0);
    const div = document.createElement('div');
    div.className = 'trader-item' + (activeTraders.has(t) ? ' active' : ' dim');
    div.innerHTML = `<div class="t-dot" style="background:${COLORS[t]}"></div><span class="t-name">${t}</span><span class="t-score">${total}/64</span>`;
    div.addEventListener('click', () => {
      if (activeTraders.has(t)) activeTraders.delete(t);
      else activeTraders.add(t);
      render();
    });
    list.appendChild(div);
  });
}

// --- Summary bar ---
function renderSummary() {
  const bar = document.getElementById('summary-bar');
  bar.innerHTML = '';
  TRADERS.forEach(t => {
    const scores = state.current[t];
    const total = scores.reduce((a,b)=>a+b,0);
    const goals = state.goals[t];
    const dim = !activeTraders.has(t);

    const card = document.createElement('div');
    card.className = 's-card';
    card.style.opacity = dim ? '0.4' : '1';
    card.style.borderColor = dim ? 'var(--border)' : COLORS[t] + '40';

    const segs = scores.map((v, i) => {
      const pct = Math.round((v/8)*100);
      return `<div class="s-seg"><div class="s-seg-fill" style="width:${pct}%;background:${bandColor(v)}"></div></div>`;
    }).join('');

    const domainRows = DOMAINS.map((d, di) => {
      const cur = scores[di];
      const goal = goals[di];
      const note = state.notes[t][di];
      const hasNote = note && note.trim().length > 0;
      const goalStr = goal && goal !== cur
        ? `<span class="s-goal-arrow">→</span><span class="s-goal-val" style="color:${COLORS[t]}">${goal}</span>${hasNote ? '<span class="note-indicator" title="Has note"></span>' : ''}`
        : '';
      const noteRow = (goal && goal !== cur && hasNote)
        ? `<div class="s-note" style="padding-left:0; color:var(--text3)">${note}</div>` : '';
      return `<div class="s-domain-row" style="flex-wrap:wrap">
        <span class="s-domain-name">${d}</span>
        <span class="s-cur" style="color:${bandColor(cur)}">${cur}</span>
        ${goalStr}
        ${noteRow}
      </div>`;
    }).join('');

    card.innerHTML = `
      <div class="s-card-top">
        <div class="s-avatar" style="background:${COLORS[t]}">${t}</div>
        <span class="s-trader-name">${t}</span>
        <span class="s-total">${total}/64</span>
      </div>
      <div class="s-progress-row">${segs}</div>
      <div class="s-domains">${domainRows}</div>
    `;
    bar.appendChild(card);
  });
}

// --- Main grid ---
function renderGrid() {
  const table = document.getElementById('main-table');
  const BANDS = [
    { label:'Beginner', color:'#e05555', levels:[1,2] },
    { label:'Intermediate', color:'#e8872a', levels:[3,4] },
    { label:'Advanced', color:'#d4a017', levels:[5,6] },
    { label:'Expert', color:'#3aaa5c', levels:[7,8] }
  ];

  let html = '<thead>';
  // Band row
  html += '<tr><th class="col-domain"></th>';
  BANDS.forEach((b, bi) => {
    html += `<th colspan="2" style="color:${b.color};border-bottom:2px solid ${b.color}40;${bi>0?'border-left:1px solid var(--border)':''}">${b.label}</th>`;
  });
  html += '</tr>';
  // Level row
  html += '<tr><th class="col-domain">Domain</th>';
  for (let lvl = 1; lvl <= 8; lvl++) {
    const divider = [3,5,7].includes(lvl) ? ' band-divider-left' : '';
    html += `<th class="${divider}">${lvl}</th>`;
  }
  html += '</tr></thead><tbody>';

  DOMAINS.forEach((domain, di) => {
    html += `<tr><td class="domain-cell">${domain}</td>`;
    for (let lvl = 1; lvl <= 8; lvl++) {
      const divider = [3,5,7].includes(lvl) ? ' band-divider-left' : '';
      const clickable = mode !== 'view' ? ' clickable' : '';
      html += `<td class="level-cell${divider}${clickable}" data-di="${di}" data-lvl="${lvl}">`;
      html += `<div class="cell-inner"><div class="pips">`;
      TRADERS.forEach(t => {
        if (!activeTraders.has(t)) return;
        const cur = state.current[t][di];
        const goal = state.goals[t][di];
        let cls = 'pip';
        let style = '';
        if (cur === lvl) { cls += ' pip-filled'; style = `background:${COLORS[t]};border-color:${COLORS[t]}`; }
        else if (goal === lvl) { cls += ' pip-goal'; style = `border-color:${COLORS[t]}`; }
        html += `<div class="${cls}" style="${style}"></div>`;
      });
      html += `</div></div></td>`;
    }
    html += '</tr>';
  });
  html += '</tbody>';
  table.innerHTML = html;

  if (mode !== 'view') {
    table.querySelectorAll('td.level-cell.clickable').forEach(td => {
      td.addEventListener('click', e => {
        const di = parseInt(td.dataset.di);
        const lvl = parseInt(td.dataset.lvl);
        openCtx(e, di, lvl);
      });
    });
  }

  const editBar = document.getElementById('edit-bar');
  const editText = document.getElementById('edit-bar-text');
  if (mode === 'view') { editBar.style.display = 'none'; }
  else {
    editBar.style.display = 'flex';
    editText.textContent = mode === 'edit'
      ? 'Click any cell to update a trader\'s current level'
      : 'Click any cell to set or clear a goal level';
  }
}

// --- Context menu ---
let ctxDi = null, ctxLvl = null;

function openCtx(e, di, lvl) {
  ctxDi = di; ctxLvl = lvl;
  const menu = document.getElementById('ctx-menu');
  const active = [...activeTraders];

  let html = `<div class="ctx-title">${DOMAINS[di]} · Level ${lvl}</div>`;

  if (mode === 'edit') {
    html += `<div style="padding:4px 8px 6px; font-size:11px; color:var(--text3)">Set current level for:</div>`;
    active.forEach(t => {
      const cur = state.current[t][di];
      html += `<div class="ctx-item" onclick="setLevel('${t}',${di},${lvl}); closeCtx();">
        <div class="ctx-dot" style="background:${COLORS[t]}"></div>
        ${t} <span style="margin-left:auto; font-family:'DM Mono',monospace; font-size:11px; color:var(--text3)">was ${cur}</span>
      </div>`;
    });
  } else {
    html += `<div style="padding:4px 8px 6px; font-size:11px; color:var(--text3)">Set goal to ${lvl} for:</div>`;
    active.forEach(t => {
      const goal = state.goals[t][di];
      const isSet = goal === lvl;
      const note = state.notes[t][di];
      const hasNote = note && note.trim().length > 0;
      html += `<div class="ctx-item" onclick="setGoal('${t}',${di},${lvl}); closeCtx();">
        <div class="ctx-dot" style="background:${COLORS[t]};${!isSet?'border:1.5px dashed '+COLORS[t]+';background:transparent':''}"></div>
        ${t} ${isSet ? '<span style="margin-left:auto;font-size:10px;color:var(--text3)">clear</span>' : ''}
      </div>`;
      if (isSet) {
        html += `<div class="ctx-item" onclick="openNotesModal('${t}',${di}); closeCtx();" style="padding-left:26px;">
          <span style="font-size:11px;color:var(--text3)">📝 ${hasNote ? 'Edit note' : 'Add note'}</span>
        </div>`;
      }
    });
  }

  menu.innerHTML = html;
  menu.style.display = 'block';
  document.getElementById('ctx-overlay').style.display = 'block';

  const rect = { x: e.clientX, y: e.clientY };
  const mw = 180, mh = 40 + active.length * 36;
  let left = rect.x + 8;
  let top = rect.y + 8;
  if (left + mw > window.innerWidth) left = rect.x - mw;
  if (top + mh > window.innerHeight) top = rect.y - mh;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
}

function closeCtx() {
  document.getElementById('ctx-menu').style.display = 'none';
  document.getElementById('ctx-overlay').style.display = 'none';
}

function setLevel(t, di, lvl) {
  state.current[t][di] = lvl;
  render();
  showToast(`${t} · ${DOMAINS[di]} set to ${lvl} (${bandName(lvl)})`);
}

function setGoal(t, di, lvl) {
  state.goals[t][di] = state.goals[t][di] === lvl ? null : lvl;
  if (!state.goals[t][di]) state.notes[t][di] = '';
  const g = state.goals[t][di];
  render();
  showToast(g ? `Goal set: ${t} · ${DOMAINS[di]} → ${g}` : `Goal cleared for ${t} · ${DOMAINS[di]}`);
}

// --- Notes modal ---
let noteCtxT = null, noteCtxDi = null;

function openNotesModal(t, di) {
  noteCtxT = t; noteCtxDi = di;
  const goal = state.goals[t][di];
  document.getElementById('modal-title').textContent = `${t} — ${DOMAINS[di]}`;
  document.getElementById('modal-meta').textContent = `Goal: level ${goal} (${bandName(goal)})`;
  document.getElementById('modal-textarea').value = state.notes[t][di] || '';
  document.getElementById('notes-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('modal-textarea').focus(), 50);
}

function closeNotesModal() {
  document.getElementById('notes-modal').style.display = 'none';
  noteCtxT = null; noteCtxDi = null;
}

function saveNote() {
  if (noteCtxT === null) return;
  state.notes[noteCtxT][noteCtxDi] = document.getElementById('modal-textarea').value.trim();
  closeNotesModal();
  render();
  showToast('Note saved');
}

function handleModalBgClick(e) {
  if (e.target === document.getElementById('notes-modal')) closeNotesModal();
}

// --- Toast ---
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// --- Mode buttons ---
document.querySelectorAll('.mode-item[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('.mode-item[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

// --- Export / Import ---
document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'trader-grid.json';
  a.click();
  showToast('Saved trader-grid.json');
});

document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('file-input').click();
});

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.current && data.goals) {
        if (!data.notes) {
          data.notes = {};
          TRADERS.forEach(t => data.notes[t] = ['','','','','','','','']);
        }
        state = data;
        render();
        showToast('Data loaded successfully');
      }
    } catch { showToast('Error reading file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function render() {
  renderSidebar();
  renderSummary();
  renderGrid();
}

render();
</script>
</body>
</html>
